name: Verify and publish INIM integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Python and JSON syntax
        run: |
          python -m compileall -q custom_components/inim_smartliving_alarm tests
          python -m json.tool custom_components/inim_smartliving_alarm/manifest.json >/dev/null
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/inim_smartliving_alarm/strings.json >/dev/null
          python -m json.tool custom_components/inim_smartliving_alarm/translations/it.json >/dev/null
      - name: Verify PNG integrity and dimensions
        run: python -m unittest discover -s tests -p test_brand_png.py -v
      - name: Install Home Assistant test harness
        run: python -m pip install homeassistant pytest
      - name: Effective entity, scenario mapping and API logging tests
        run: python -m pytest -q tests/test_effective_entities.py tests/test_inim_api_logging.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Repository issues/topics are disabled/unset and cannot be changed by this connector.
          # Keep code, brand and manifest validation enabled.
          ignore: 'issues topics'

  release:
    name: Publish beta or stable only after validation
    needs: [python, hassfest, hacs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable version from manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/inim_smartliving_alarm/manifest.json"))["version"])')
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+)?$'; then
            echo "::error::Invalid release version $VERSION"; exit 1
          fi
          TAG="v${VERSION}"
          NOTES="RELEASE_NOTES_${VERSION}.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::Missing release notes: $NOTES"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version $TAG already published; no overwrite"
            exit 0
          fi
          RELEASE_ARGS=()
          if [[ "$VERSION" == *b* ]]; then RELEASE_ARGS+=(--prerelease); fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "INIM SmartLiving Alarm $TAG" --notes-file "$NOTES" "${RELEASE_ARGS[@]}"
